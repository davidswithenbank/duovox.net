# Builds duovox.net and deploys it to GitHub Pages on every push to master (including the admin price
# publisher's commits), so the per-language pages (/es/, /fr/ ...) always carry the current English page's
# prices and the current translations. See tools/build_lang_pages.py.
#
# Needs: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions" (one-time switch).
# The translation check runs as a SEPARATE job: if a translation is missing or out of date the site still
# deploys (that line shows in English on the language pages) and this run is marked failed, so GitHub
# emails the repository owner.
name: Build and deploy site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build site with language pages
        run: python tools/build_lang_pages.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check translations (missing, out of date, markup, numbers, plan names, untranslated text)
        run: python tools/check_translations.py

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
