# 9 Oct 2026: duovox.net is now built and served by CLOUDFLARE (Workers static assets, project "duovox-site",
# see wrangler.jsonc + tools/site_worker.js). Cloudflare Workers Builds rebuilds and deploys on every push to
# master, including the admin price publisher's commits. GitHub Pages is switched off.
#
# This workflow now only runs the translation check: if a translation is missing or out of date the site still
# deploys (that line shows in English on the language pages) and this run is marked failed, so GitHub emails the
# repository owner.
name: Check translations

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check translations (missing, out of date, markup, numbers, plan names, untranslated text)
        run: python tools/check_translations.py
